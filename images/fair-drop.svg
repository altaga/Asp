<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#231815"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="24" fill="#FFF8EF"/>

  <text x="40" y="52" font-size="14" font-weight="700" letter-spacing="3" fill="#836EF9">WITH ASP ON MONAD</text>
  <text x="40" y="82" font-size="22" font-weight="700" fill="#231815">One verified person, one allocation per release.</text>

  <!-- scalper -->
  <circle cx="110" cy="138" r="22" fill="#231815"/>
  <rect x="76" y="164" width="68" height="56" rx="26" fill="#231815"/>
  <text x="110" y="244" font-size="15" font-weight="700" fill="#231815" text-anchor="middle">scalper</text>
  <g stroke="#231815" stroke-opacity=".3" stroke-width="2">
    <line x1="144" y1="185" x2="270" y2="130"/>
    <line x1="144" y1="185" x2="270" y2="185"/>
    <line x1="144" y1="185" x2="270" y2="240"/>
  </g>

  <!-- fan -->
  <circle cx="110" cy="318" r="22" fill="#FFF8EF" stroke="#E8112D" stroke-width="3"/>
  <rect x="76" y="344" width="68" height="56" rx="26" fill="none" stroke="#E8112D" stroke-width="3"/>
  <text x="110" y="424" font-size="15" font-weight="700" fill="#231815" text-anchor="middle">fan</text>
  <line x1="144" y1="355" x2="270" y2="355" stroke="#231815" stroke-opacity=".3" stroke-width="2"/>

  <!-- wallets -->
  <g fill="#fff" stroke="#231815" stroke-width="2">
    <rect x="270" y="116" width="52" height="28" rx="7"/>
    <rect x="270" y="171" width="52" height="28" rx="7"/>
    <rect x="270" y="226" width="52" height="28" rx="7"/>
    <rect x="270" y="341" width="52" height="28" rx="7"/>
  </g>
  <g fill="#231815"><circle cx="310" cy="130" r="4"/><circle cx="310" cy="185" r="4"/><circle cx="310" cy="240" r="4"/><circle cx="310" cy="355" r="4"/></g>

  <!-- World gate -->
  <text x="447" y="104" font-size="14" font-weight="700" fill="#231815" text-anchor="middle">World ID</text>
  <rect x="430" y="114" width="34" height="270" rx="17" fill="#231815"/>
  <text x="447" y="408" font-size="13" fill="#6B625C" text-anchor="middle">same human = same nullifier</text>

  <line x1="326" y1="185" x2="424" y2="185" stroke="#231815" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="326" y1="355" x2="424" y2="355" stroke="#231815" stroke-width="2" marker-end="url(#arrow)"/>
  <g stroke="#231815" stroke-width="2" stroke-opacity=".35">
    <line x1="326" y1="130" x2="396" y2="130"/>
    <line x1="326" y1="240" x2="396" y2="240"/>
  </g>
  <g stroke="#E8112D" stroke-width="4" stroke-linecap="round">
    <line x1="400" y1="120" x2="418" y2="140"/><line x1="418" y1="120" x2="400" y2="140"/>
    <line x1="400" y1="230" x2="418" y2="250"/><line x1="418" y1="230" x2="400" y2="250"/>
  </g>
  <text x="372" y="282" font-size="12" fill="#E8112D" text-anchor="middle">extra wallets</text>
  <text x="372" y="297" font-size="12" fill="#E8112D" text-anchor="middle">add nothing</text>

  <!-- Monad payment -->
  <line x1="470" y1="185" x2="532" y2="185" stroke="#231815" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="355" x2="532" y2="355" stroke="#231815" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="538" y="168" width="172" height="34" rx="17" fill="#836EF9"/>
  <text x="624" y="190" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">USDC paid on Monad</text>
  <rect x="538" y="338" width="172" height="34" rx="17" fill="#836EF9"/>
  <text x="624" y="360" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">USDC paid on Monad</text>
  <line x1="714" y1="185" x2="784" y2="185" stroke="#231815" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="714" y1="355" x2="784" y2="355" stroke="#231815" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- the drop -->
  <rect x="790" y="110" width="370" height="290" rx="18" fill="#fff" stroke="#231815" stroke-width="2.5"/>
  <path d="M790 156 V128 a18 18 0 0 1 18 -18 H1142 a18 18 0 0 1 18 18 V156 z" fill="#E8112D"/>
  <text x="975" y="140" font-size="16" font-weight="700" letter-spacing="2" fill="#fff" text-anchor="middle">LIMITED DROP</text>
  <g fill="#fff" stroke="#CFC7C0" stroke-width="2">
    <rect x="884" y="180" width="40" height="40" rx="8"/><rect x="938" y="180" width="40" height="40" rx="8"/>
    <rect x="992" y="180" width="40" height="40" rx="8"/><rect x="1046" y="180" width="40" height="40" rx="8"/>
    <rect x="884" y="236" width="40" height="40" rx="8"/><rect x="938" y="236" width="40" height="40" rx="8"/>
    <rect x="992" y="236" width="40" height="40" rx="8"/><rect x="1046" y="236" width="40" height="40" rx="8"/>
    <rect x="884" y="292" width="40" height="40" rx="8"/><rect x="938" y="292" width="40" height="40" rx="8"/>
    <rect x="992" y="292" width="40" height="40" rx="8"/><rect x="1046" y="292" width="40" height="40" rx="8"/>
  </g>
  <rect x="822" y="180" width="40" height="40" rx="8" fill="#231815"/>
  <rect x="822" y="336" width="40" height="40" rx="8" fill="#E8112D"/>
  <text x="975" y="372" font-size="14" fill="#6B625C" text-anchor="middle">the rest stays for other people</text>
</svg>
