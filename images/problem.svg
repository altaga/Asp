<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#231815"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="24" fill="#FFF8EF"/>

  <text x="40" y="52" font-size="14" font-weight="700" letter-spacing="3" fill="#E8112D">WITHOUT ASP</text>
  <text x="40" y="82" font-size="22" font-weight="700" fill="#231815">One person, many wallets, the whole drop.</text>

  <!-- scalper -->
  <circle cx="140" cy="215" r="24" fill="#231815"/>
  <rect x="104" y="244" width="72" height="70" rx="30" fill="#231815"/>
  <text x="140" y="345" font-size="15" font-weight="700" fill="#231815" text-anchor="middle">1 scalper</text>
  <rect x="92" y="358" width="96" height="26" rx="13" fill="#E8112D"/>
  <text x="140" y="376" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">resale 10x</text>

  <!-- wallets -->
  <g stroke="#231815" stroke-opacity=".3" stroke-width="2">
    <line x1="176" y1="262" x2="330" y2="125"/>
    <line x1="176" y1="262" x2="330" y2="165"/>
    <line x1="176" y1="262" x2="330" y2="205"/>
    <line x1="176" y1="262" x2="330" y2="245"/>
    <line x1="176" y1="262" x2="330" y2="285"/>
    <line x1="176" y1="262" x2="330" y2="325"/>
  </g>
  <g fill="#fff" stroke="#231815" stroke-width="2">
    <rect x="330" y="110" width="56" height="30" rx="7"/>
    <rect x="330" y="150" width="56" height="30" rx="7"/>
    <rect x="330" y="190" width="56" height="30" rx="7"/>
    <rect x="330" y="230" width="56" height="30" rx="7"/>
    <rect x="330" y="270" width="56" height="30" rx="7"/>
    <rect x="330" y="310" width="56" height="30" rx="7"/>
  </g>
  <g fill="#231815">
    <circle cx="374" cy="125" r="4"/><circle cx="374" cy="165" r="4"/><circle cx="374" cy="205" r="4"/>
    <circle cx="374" cy="245" r="4"/><circle cx="374" cy="285" r="4"/><circle cx="374" cy="325" r="4"/>
  </g>
  <text x="358" y="372" font-size="14" fill="#6B625C" text-anchor="middle">bots, accounts, wallets</text>

  <g stroke="#231815" stroke-width="2" marker-end="url(#arrow)">
    <line x1="390" y1="125" x2="554" y2="125"/>
    <line x1="390" y1="165" x2="554" y2="165"/>
    <line x1="390" y1="205" x2="554" y2="205"/>
    <line x1="390" y1="245" x2="554" y2="245"/>
    <line x1="390" y1="285" x2="554" y2="285"/>
    <line x1="390" y1="325" x2="554" y2="325"/>
  </g>

  <!-- the drop -->
  <rect x="560" y="90" width="300" height="270" rx="18" fill="#fff" stroke="#231815" stroke-width="2.5"/>
  <path d="M560 136 V108 a18 18 0 0 1 18 -18 H842 a18 18 0 0 1 18 18 V136 z" fill="#E8112D"/>
  <text x="710" y="120" font-size="16" font-weight="700" letter-spacing="2" fill="#fff" text-anchor="middle">LIMITED DROP</text>
  <g fill="#B9B1AA">
    <rect x="582" y="160" width="40" height="40" rx="8"/><rect x="636" y="160" width="40" height="40" rx="8"/>
    <rect x="690" y="160" width="40" height="40" rx="8"/><rect x="744" y="160" width="40" height="40" rx="8"/>
    <rect x="798" y="160" width="40" height="40" rx="8"/>
    <rect x="582" y="214" width="40" height="40" rx="8"/><rect x="636" y="214" width="40" height="40" rx="8"/>
    <rect x="690" y="214" width="40" height="40" rx="8"/><rect x="744" y="214" width="40" height="40" rx="8"/>
    <rect x="798" y="214" width="40" height="40" rx="8"/>
  </g>
  <text x="710" y="300" font-size="15" fill="#6B625C" text-anchor="middle">all taken in seconds</text>

  <!-- the fan -->
  <line x1="866" y1="262" x2="1018" y2="262" stroke="#231815" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <rect x="1005" y="146" width="110" height="30" rx="15" fill="#231815"/>
  <text x="1060" y="166" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">SOLD OUT</text>
  <circle cx="1060" cy="215" r="24" fill="#FFF8EF" stroke="#E8112D" stroke-width="3"/>
  <rect x="1024" y="244" width="72" height="70" rx="30" fill="none" stroke="#E8112D" stroke-width="3"/>
  <text x="1060" y="345" font-size="15" font-weight="700" fill="#231815" text-anchor="middle">the real fan</text>
  <text x="1060" y="368" font-size="14" fill="#6B625C" text-anchor="middle">gets nothing</text>
</svg>
