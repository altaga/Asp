; Asp gacha — XIAO ESP32-C5 (default) or Feather ESP32 + stepper (PUL/DIR/ENA) + MQTT WSS
; CLI: pio run | pio run -t upload | pio device monitor
; ESP32-C5 needs the pioarduino platform (official espressif32 has no C5 support).

[platformio]
default_envs = xiao_esp32c5

[common]
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = CRLF
monitor_filters = send_on_enter, time, colorize
monitor_rts = 0
monitor_dtr = 0
lib_deps =
	waspinator/AccelStepper@^1.64
	bblanchon/ArduinoJson@^7.0.4
build_flags =
	-D CORE_DEBUG_LEVEL=0
	-D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=1
	-Wno-deprecated-declarations

[env:xiao_esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = seeed_xiao_esp32c5
board_build.variants_dir = variants
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_echo = ${common.monitor_echo}
monitor_eol = ${common.monitor_eol}
monitor_filters = ${common.monitor_filters}
monitor_rts = ${common.monitor_rts}
monitor_dtr = ${common.monitor_dtr}
lib_deps = ${common.lib_deps}
build_flags =
	${common.build_flags}
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

[env:featheresp32]
platform = espressif32
board = featheresp32
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_echo = ${common.monitor_echo}
monitor_eol = ${common.monitor_eol}
monitor_filters = ${common.monitor_filters}
monitor_rts = ${common.monitor_rts}
monitor_dtr = ${common.monitor_dtr}
upload_speed = 921600
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
